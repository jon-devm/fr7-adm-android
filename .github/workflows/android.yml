name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "3.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Firebase para notificações (segredo GOOGLE_SERVICES_JSON, opcional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            # Avisa o site que este APK sabe receber notificações.
            node -e 'const f="capacitor.config.json",c=require("./"+f);c.android.appendUserAgent=c.appendUserAgent="FR7App/Android FR7Push";require("fs").writeFileSync(f,JSON.stringify(c,null,2))'
            echo "Notificações push: ligadas"
          else
            echo "::warning::Sem GOOGLE_SERVICES_JSON: o APK sai sem notificações push (o resto funciona)."
          fi

      - name: Copiar configuração para o projeto Android
        run: npx cap sync android

      - name: Chave de assinatura (segredos do repositório)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fr7.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/fr7.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem chave de assinatura: o APK sai assinado com chave de teste."
          fi

      - name: Gerar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FR7-ADM-${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FR7-ADM-${{ env.APP_VERSION }}-apk
          path: FR7-ADM-${{ env.APP_VERSION }}.apk

      - name: Publicar na página de versões (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "FR7-ADM-${APP_VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "FR7 ADM ${APP_VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "FR7 ADM ${APP_VERSION} — app Android com leitor de códigos nativo, entrada por digital, notificações e uso sem internet. Baixe FR7-ADM-${APP_VERSION}.apk no celular e instale (permita instalar apps desconhecidos se pedir)."
